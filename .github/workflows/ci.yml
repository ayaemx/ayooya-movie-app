name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (includes accessibility rules)
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Tests (API security + UI)
        run: npm test
      - name: Build
        run: npm run build
      - name: Dependency audit (what ships to users)
        run: npm audit --omit=dev --audit-level=high
      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run
      - name: Secret scan — no API keys in the client bundle or repo
        run: |
          if grep -rEn "api_key=[A-Za-z0-9]{16,}|VITE_TMDB_API_KEY" dist src; then
            echo "Possible secret in client code" && exit 1
          fi
          if git ls-files | grep -E "(^|/)\.env$|\.dev\.vars$"; then
            echo "Secret file is tracked by git" && exit 1
          fi

  deploy:
    # Runs only on main, and only once the repo variable DEPLOY_ENABLED=true and
    # the CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets have been added.
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx wrangler d1 migrations apply ayooya --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
